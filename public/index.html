<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>SayCheese By Nestor · Panel</title>
  <link rel="stylesheet" href="/public/styles.css" />
</head>
<body class="mobile-app">
  <header class="app-header">
    <div class="brand">
      <span class="logo-dot"></span>
    <span id="brandText">SayCheese By Nestor</span>
  <span class="app-version" style="display:block;font-size:10px;line-height:1;color:#94a3b8;margin-top:2px;">V1.7</span>
    </div>
    <div class="header-right">
      <span id="clock" class="pill"></span>
      <span id="botStatus" class="pill status">unknown</span>
      <button id="btnLogout" class="btn btn-danger">Salir</button>
    </div>
  </header>

  <main class="app-main">
    <section class="toolbar">
      <button id="btnStart" class="btn">Iniciar Bot</button>
      <button id="btnRelink" class="btn">Vincular nueva cuenta</button>
      <!-- QR oculto -->
      <!-- <button id="btnShowQr" class="btn">Ver QR</button> -->
      <div class="searchbar" role="search">
        <span class="icon" aria-hidden="true">🔎</span>
        <input id="phoneFilter" class="search-input" type="search" inputmode="numeric" pattern="[0-9]*" placeholder="Filtrar por teléfono…" aria-label="Filtrar por teléfono" />
        <button id="clearFilter" class="clear-btn" title="Limpiar">✕</button>
      </div>
      <button id="btnProduction" class="icon-btn" title="Producción" aria-label="Producción">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 2c.8 0 1.5.7 1.5 1.5S12.8 5 12 5s-1.5-.7-1.5-1.5S11.2 2 12 2zm-6 8h12l2 3H4l2-3zm-1 5h14v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-4z"/>
        </svg>
      </button>
    </section>

    <section class="tabs-container">
      <div id="panel-pendientes" class="panel active" data-name="pendientes">
        <div id="list-pendientes" class="card-list"></div>
        <div id="empty-pendientes" class="empty">No hay pedidos pendientes.</div>
      </div>

      <div id="panel-confirmados" class="panel" data-name="confirmados">
        <div id="list-confirmados" class="card-list"></div>
        <div id="empty-confirmados" class="empty">No hay pedidos confirmados.</div>
      </div>

      <div id="panel-cancelados" class="panel" data-name="cancelados">
        <div id="list-cancelados" class="card-list"></div>
        <div id="empty-cancelados" class="empty">No hay pedidos cancelados.</div>
      </div>

      <div id="panel-historico" class="panel" data-name="historico">
        <div class="historico-toolbar">
          <label>
            Mes:
            <input id="histMonth" type="month" />
          </label>
          <button id="histReload" class="btn btn-sm">Actualizar</button>
        </div>
        <div id="histSummary" class="hist-summary"></div>
        <div id="histSabores" class="hist-sabores"></div>
        <div id="histTamanos" class="hist-tamanos"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-target="pendientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
      <span>Pendientes</span>
    </button>
    <button class="tab" data-target="confirmados">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2l-3.5-3.5 1.4-1.4L9 13.4l7.1-7.1 1.4 1.4z"/></svg>
      <span>Confirmados</span>
      <span id="badge-confirmados" class="tab-badge" hidden>0</span>
    </button>
    <button class="tab" data-target="cancelados">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12l-1 14H7L6 6zm3-2h6l1 2H8l1-2z"/></svg>
      <span>Cancelados</span>
      <span id="badge-cancelados" class="tab-badge" hidden>0</span>
    </button>
    <button class="tab" data-target="historico">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 0 8.95 10.17 1 1 0 0 0-1-.83h-2a1 1 0 0 0-.94.66A6 6 0 1 1 18 9h-3l4 5 4-5h-2A9 9 0 0 0 13 3z"/></svg>
      <span>Histórico</span>
    </button>
  </nav>

  <!-- Modal QR -->
  <div id="modal-qr" class="modal">
    <div class="modal-content">
      <h3>Vincular WhatsApp</h3>
      <img id="qrImage" alt="QR" />
      <p id="qrStatus">Esperando QR…</p>
      <button id="btnCloseQr" class="btn">Cerrar</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="modalProduction" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="prodTitle">
    <div class="modal-card">
      <h3 id="prodTitle">Calcular producción</h3>
      <label for="prodDate">Fecha</label>
      <input id="prodDate" type="date" />
      <div class="actions">
        <button id="prodCalc" class="btn btn-primary">Calcular</button>
        <button id="prodClose" class="btn">Cerrar</button>
      </div>
      <div id="prodResult" class="prod-result"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/public/index.js" defer></script>
</body>
</html>
